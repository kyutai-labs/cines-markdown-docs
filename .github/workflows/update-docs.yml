name: Update docs

on:
  schedule:
    - cron: "17 4 * * *" # every day at 04:17 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/**
      - .github/workflows/update-docs.yml

permissions:
  contents: write

concurrency:
  group: update-docs
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.4"
          cache-dependency-glob: scripts/generate.py.lock

      - name: Regenerate Markdown
        run: uv run --locked scripts/generate.py

      - name: Commit and push if changed
        run: |
          git add -A docs
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update Adastra docs ($(date -u +%Y-%m-%d))"
          git push
